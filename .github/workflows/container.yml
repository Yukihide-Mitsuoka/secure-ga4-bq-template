# Container image scan (REL-020). Runs only when a Dockerfile exists.
name: Container Scan

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "**/Dockerfile"
      - ".github/workflows/container.yml"
      - "scripts/actions/container-scan/**"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "**/Dockerfile"
      - "scripts/actions/container-scan/**"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./scripts/actions/container-scan
