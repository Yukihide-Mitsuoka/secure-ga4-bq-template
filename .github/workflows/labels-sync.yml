# Keeps GitHub labels in sync with .github/labels.yml (Policy as Code).
name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - "scripts/actions/labels-sync/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./scripts/actions/labels-sync
